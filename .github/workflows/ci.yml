name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # The gauntlet: flatten validates self-containment, then lint/check/build
      # enforce the rules the dev server and static build enforce differently.
      - run: bun run scripts/flatten.ts
      - run: bun run lint
      - run: bun run check
      - run: bun run build
